name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Type-check & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --generator client

      - name: Type check
        run: npm run type-check

      # `npm run test:cov` runs this same suite with coverage locally (and
      # enforces jest.config.js's coverageThreshold ratchet); left out of CI
      # because coverage instrumentation roughly doubles the suite's run time.
      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imamzain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --generator client

      # migrate deploy (not db push): the baseline migration creates the
      # citext/pgcrypto/pg_trgm extensions the schema needs, and this doubles
      # as a check that the migration chain applies cleanly on a fresh DB.
      - name: Apply migrations to test database
        run: npm run prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imamzain_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/imamzain_test

      # schema.prisma has drifted from the actual migrations before (a
      # daily_hadith_random_picks index existed in the migration history but was
      # missing from schema.prisma for weeks) — this catches that class of bug
      # before it reaches prod. Partial indexes and CHECK constraints can't be
      # expressed in schema.prisma at all, so they never show up as a diff here;
      # if this step ever does fail, check prisma/INTENTIONAL_DRIFT.md first.
      - name: Check schema.prisma against applied migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imamzain_test

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/imamzain_test
          JWT_SECRET: test-only-secret-not-for-production
          BCRYPT_ROUNDS: '4'
  worker:
    name: Worker (typecheck & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generates the worker Prisma client and worker-configuration.d.ts first.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # docs/HONO-MIGRATION-PLAN.md, Phase 2 task 5: the same black-box suite against Nest and against the
  # Worker (wrangler dev, whose unported routes fall through to that Nest), on a migrated + seeded DB.
  contract:
    name: Contract tests (Nest and Worker)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imamzain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imamzain_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/imamzain_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install dependencies (Nest)
        run: npm ci

      - name: Install dependencies (Worker)
        run: npm ci
        working-directory: worker

      - name: Build Nest
        run: npm run build

      # The seed creates the languages, permissions, roles and the super-admin the suite mints its token for.
      - name: Migrate and seed the database
        run: npm run prisma:deploy && npm run prisma:seed
        env:
          SEED_ADMIN_PASSWORD: ci-only-password-not-secret
          BCRYPT_ROUNDS: '4'

      - name: Generate the Worker Prisma client and types
        run: npm run gen
        working-directory: worker

      - name: Contract tests against Nest, then the Worker
        run: npm run contract
        working-directory: worker
        env:
          CONTRACT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imamzain_test

      - name: Server and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-logs
          path: worker/test/.work/logs/
